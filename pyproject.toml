[project]
name = "fraudfirstaid"
version = "0.1.0"
description = "An emergency response and reporting assistance platform for victims of cyber fraud in India."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
